title: PatchPilot365 Docs
description: >-
  Documentation for PatchPilot365 — a multi-tenant vulnerability management
  tool that orchestrates remediation for devices enrolled in Microsoft
  Defender and Intune.

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

url: "https://docs.patchpilot365.com"
baseurl: ""

logo: "/assets/images/logo.png"
color_scheme: patchpilot-light
search_enabled: true
heading_anchors: true

aux_links:
  "PatchPilot365 on GitHub":
    - "https://github.com/PatchPilot365/PatchPilot"
aux_links_new_tab: true

exclude:
  - internal/
  - node_modules/
  - vendor/
  - Gemfile
  - Gemfile.lock
