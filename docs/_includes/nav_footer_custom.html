<button class="pp-theme-toggle" type="button" aria-label="Toggle dark mode"
  style="display:flex;align-items:center;gap:0.4em;width:100%;margin-top:0.6em;padding:0.4em 0.6em;
         font-size:0.8em;border:1px solid var(--border-color, #e2e2e2);border-radius:4px;
         background:transparent;color:inherit;cursor:pointer;">
  <span class="pp-theme-toggle-icon" aria-hidden="true">🌙</span>
  <span class="pp-theme-toggle-label">Dark mode</span>
</button>

<script>
(function () {
  if (window.__ppThemeToggleInit) return;
  window.__ppThemeToggleInit = true;

  var LIGHT = "patchpilot-light";
  var DARK = "patchpilot-dark";
  var STORAGE_KEY = "pp-color-scheme";

  // jtd.getTheme() only returns the text after the LAST hyphen in the
  // stylesheet filename (e.g. "dark", not "patchpilot-dark"), so it can't
  // be compared against our full scheme names — track state ourselves.
  var current = LIGHT;

  function apply(theme) {
    current = theme;
    jtd.setTheme(theme);
    document.querySelectorAll(".pp-theme-toggle-icon").forEach(function (icon) {
      icon.textContent = theme === DARK ? "☀️" : "🌙";
    });
    document.querySelectorAll(".pp-theme-toggle-label").forEach(function (label) {
      label.textContent = theme === DARK ? "Light mode" : "Dark mode";
    });
  }

  var saved = null;
  try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  apply(saved === LIGHT || saved === DARK ? saved : LIGHT);

  document.querySelectorAll(".pp-theme-toggle").forEach(function (btn) {
    jtd.addEvent(btn, "click", function () {
      var next = current === DARK ? LIGHT : DARK;
      try { localStorage.setItem(STORAGE_KEY, next); } catch (e) {}
      apply(next);
    });
  });
})();
</script>
